<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6753c">
  <title>雷霆素材库</title>
  <link rel="icon" href="assets/studio-face.png" type="image/png">
  <link rel="stylesheet" href="styles.css?v=20261001-preview1"><link rel="stylesheet" href="motion.css?v=20260930-focus1">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="./"><img src="assets/studio-face.png" alt=""><span>小橙子</span></a>
    <nav id="sidebar-filters" aria-label="素材分类">
      <button class="nav-item active" data-type="all"><span>▦</span>全部素材<b id="nav-count">0</b></button>
      <button class="nav-item" data-type="image"><span>▧</span>图片与背景</button>
      <button class="nav-item" data-type="video"><span>▷</span>视频素材</button>
      <button class="nav-item" data-type="audio"><span>♫</span>音效与音乐</button>
      <button class="nav-item" data-type="animation"><span>✧</span>动画与元素</button>
      <button class="nav-item" data-type="other"><span>□</span>其他文件</button>
      <button class="nav-item" data-type="favorites"><span>♡</span>我的收藏</button>
    </nav>
    <div class="sidebar-bottom"><button id="settings-button" class="nav-item"><span>⚙</span>连接设置</button><div class="hosting-note"><span id="hosting-provider">pCloud</span></div></div>
  </aside>
  <main>
    <header class="topbar"><h1>雷霆素材库</h1><div class="topbar-right"><button id="member-login-button" class="button secondary account-button">登录 pCloud</button><button id="member-avatar" class="avatar" aria-label="我的 pCloud 账号"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><img id="member-avatar-image" alt="pCloud 头像" hidden></button></div></header>
    <section class="library">
      <div class="section-heading"><div class="section-title"><h2 id="library-title">全部素材</h2><span id="results-text">读取目录中…</span></div><div class="library-actions"><button id="refresh-button" class="button secondary" aria-label="刷新素材目录">↻ 刷新</button><button id="upload-button" class="button primary">↑ 上传素材</button></div></div>
      <div class="toolbar">
        <label class="search"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="搜索素材" aria-label="搜索素材"><kbd>/</kbd></label>
        <label class="filter-label"><span>文件夹</span><select id="folder-filter" aria-label="筛选文件夹"><option value="*">全部文件夹</option></select></label>
        <label class="filter-label"><span>排序</span><select id="sort-select" aria-label="素材排序"><option value="newest">最近添加</option><option value="name">名称 A–Z</option><option value="oldest">最早添加</option><option value="largest">文件从大到小</option><option value="smallest">文件从小到大</option></select></label>
        <div class="view-switch" role="group" aria-label="显示方式"><button class="active" data-view="grid" aria-label="缩略图视图" aria-pressed="true">▦</button><button data-view="list" aria-label="列表视图" aria-pressed="false">☰</button></div>
      </div>
      <div id="draft-notice" class="notice" hidden>连接设置仅保存在本机，尚未发布。</div>
      <p id="member-status" class="member-status" role="status"></p><p id="cloud-status" class="cloud-status" role="status"></p>
      <div id="asset-grid" class="asset-grid"></div><div id="empty-state" class="empty-state" hidden><h3>没有找到素材</h3><button id="reset-filters" class="button secondary">清除筛选</button></div>
    </section>
    <footer><span id="footer-status">演示目录</span></footer>
  </main>
  <dialog id="detail-dialog" class="detail-dialog"><button class="dialog-close" data-close aria-label="关闭">×</button><div id="detail-preview" class="detail-preview"></div><div class="detail-content"><div class="detail-kicker" id="detail-type"></div><h2 id="detail-name"></h2><p id="detail-description"></p><div id="detail-tags" class="tag-list"></div><div id="detail-meta" class="detail-meta"></div><div class="detail-actions"><a id="detail-download" class="button primary" target="_blank" rel="noopener noreferrer">↓ 获取原文件</a><a id="detail-source" class="button secondary" target="_blank" rel="noopener noreferrer" hidden>↗ pCloud 预览</a><button id="detail-favorite" class="button secondary">♡ 收藏</button></div><p id="detail-note" class="field-help"></p></div></dialog>
  <dialog id="upload-dialog" class="form-dialog"><button class="dialog-close" data-close aria-label="关闭">×</button><h2>上传素材</h2><p id="upload-target" class="field-help"></p><label>上传成员<input id="upload-member" readonly></label><label id="choose-files" role="button" tabindex="0" class="button secondary full-width" for="upload-files">＋ 选择文件<input id="upload-files" type="file" multiple hidden></label><div id="upload-queue" class="upload-queue"></div><p id="upload-message" class="field-help" role="status"></p><div class="settings-actions"><button id="upload-start" class="button primary" disabled>开始上传</button><button id="upload-cancel" class="button secondary" hidden>停止上传</button></div><small id="upload-duplicate-note" class="field-help">同名文件自动改名。</small></dialog>
  <dialog id="settings-dialog" class="form-dialog">
    <button class="dialog-close" data-close aria-label="关闭">×</button><h2>连接素材文件夹</h2>
    <form id="settings-form">
      <label>素材托管平台<select id="storage-provider"><option value="google">Google Drive</option><option value="pcloud">pCloud</option><option value="openlist">OpenList 云端试接</option></select></label>
      <label><span id="folder-url-label">文件夹分享链接</span><input id="folder-url" type="url" placeholder="粘贴整个素材文件夹的分享链接"></label>
      <div id="google-fields" hidden>
        <label>Google API Key<input id="google-api-key" maxlength="110" autocomplete="off" spellcheck="false" placeholder="AIza…"><small class="field-help">用于公开目录与文件夹选择器。请限制网站来源及可调用的 API。</small></label>
        <label>Google OAuth Client ID<input id="google-client-id" maxlength="200" autocomplete="off" spellcheck="false" placeholder="…apps.googleusercontent.com"></label>
        <label>Google Cloud 项目编号<input id="google-project-number" maxlength="20" inputmode="numeric" placeholder="Project number（纯数字）"><small class="field-help">只填公开配置，不填 Client Secret、密码或登录令牌。</small></label>
        <a class="text-button" href="https://github.com/xiaolubbstudio/xczstudio/blob/main/docs/Google-Drive接入.md" target="_blank" rel="noopener">查看首次配置步骤 ↗</a>
      </div>
      <div id="openlist-fields" hidden><label>素材目录<input id="openlist-folder-path" value="/" autocomplete="off" placeholder="/"></label><small class="field-help">相对于成员在后台获准访问的目录。上传尚未完成验收。</small></div>
      <div id="pcloud-fields"><label>pCloud 应用 Client ID<input id="pcloud-client-id" maxlength="200" autocomplete="off" placeholder="只填公开 Client ID"></label><label>pCloud 数据地区<select id="cloud-region"><option value="us">美国</option><option value="eu">欧洲</option></select></label></div>
      <p id="settings-error" class="form-error" role="alert"></p><button class="button primary full-width" type="submit">保存并连接</button>
    </form>
    <details class="connection-help"><summary>连接与发布帮助</summary><h3>发布设置</h3><p class="field-help">导出并替换 data/catalog.js，提交仓库发布。</p><div class="settings-actions"><button id="export-button" class="button secondary">↓ 导出连接设置</button><label class="button secondary" for="import-input">↑ 导入 JSON<input id="import-input" type="file" accept=".json,application/json" hidden></label></div><button id="export-json-button" class="text-button">导出 JSON 备份</button><button id="restore-button" class="text-button danger">恢复网站发布的设置</button><div id="change-confirmation" class="notice" hidden><p id="confirm-message"></p><div class="settings-actions"><button id="confirm-change" class="button primary">确认替换</button><button id="cancel-change" class="button secondary">取消</button></div></div><p id="settings-message" class="field-help" role="status"></p><p id="connection-provider-help" class="field-help"></p></details>
  </dialog>
  <dialog id="member-dialog" class="form-dialog"><button class="dialog-close" data-close aria-label="关闭">×</button><h2>成员登录</h2><p id="member-info" class="dialog-intro">请使用受邀成员账号登录。</p><p id="member-permission-help" class="field-help"></p><form id="openlist-login-form" hidden><label>成员账号<input id="openlist-username" autocomplete="username" maxlength="100" required></label><label>密码<input id="openlist-password" type="password" autocomplete="current-password" required></label><label>两步验证码（如已启用）<input id="openlist-otp" autocomplete="one-time-code" inputmode="numeric" maxlength="8"></label><button id="openlist-login-submit" class="button primary full-width" type="submit">登录素材库</button></form><div class="settings-actions"><button id="member-authorize" class="button primary">登录</button><button id="member-folder-authorize" class="button primary" hidden>授权素材文件夹</button><button id="member-recheck" class="button secondary" hidden>重新核实权限</button><button id="member-logout" class="button secondary" hidden>退出登录</button></div><p id="member-login-message" class="field-help" role="status"></p><p class="field-help">关闭标签页即退出登录。</p></dialog>
  <div id="toast" class="toast" role="status" popover="manual" hidden></div>
  <script src="data/catalog.js?v=20260930-drive1"></script><script src="pcloud-auth.js?v=20260928-auth2"></script><script src="pcloud-client.js?v=20261001-preview1"></script><script src="google-drive-client.js?v=20261001-preview1"></script><script src="google-drive-auth.js?v=20260930-drive1"></script><script src="openlist-client.js?v=20261001-thumbs1"></script><script src="openlist-auth.js?v=20261001-accounts1"></script><script src="motion.js?v=20260930-focus1"></script><script src="preview-cache.js?v=20261001-preview1"></script><script src="app.js?v=20261001-thumbs1"></script>
</body>
</html>
